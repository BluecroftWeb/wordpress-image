# Rebuilds Docker's official wordpress:php8.3-apache image from docker-library/wordpress
# against the current php:8.3-apache, for when a PHP security release lands before
# Docker Hub's WordPress image is rebuilt. Push target: ghcr.io/bluecroftweb/wordpress
name: Build WordPress image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: docker-library/wordpress
          path: upstream

      # pecl.php.net is returning 500s after the 21 Oct 2026 PHP security release;
      # build the same imagick release from its GitHub tag instead.
      - name: Fetch imagick from GitHub instead of PECL
        working-directory: upstream/latest/php8.3/apache
        run: |
          ver=$(grep -oE 'pecl install imagick-[0-9.]+' Dockerfile | cut -d- -f2)
          python3 - "$ver" <<'EOF'
          import sys
          ver = sys.argv[1]; p = 'Dockerfile'; s = open(p).read()
          old = f"\tpecl install imagick-{ver}; \\\n"
          new = (f"\tmkdir -p /usr/src/php/ext/imagick; \\\n"
                 f"\tcurl -fsSL https://github.com/Imagick/imagick/archive/refs/tags/{ver}.tar.gz | tar -xz --strip-components=1 -C /usr/src/php/ext/imagick; \\\n"
                 f"\tdocker-php-ext-install -j \"$(nproc)\" imagick; \\\n")
          assert old in s, 'pecl line not found'
          s = s.replace(old, new).replace("\trm -r /tmp/pear; \\\n", "\trm -rf /tmp/pear; \\\n")
          open(p, 'w').write(s)
          EOF
          grep -n imagick Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: upstream/latest/php8.3/apache
          platforms: linux/arm64
          pull: true
          push: true
          tags: ghcr.io/bluecroftweb/wordpress:php8.3-apache
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Rebuild of docker-library wordpress:php8.3-apache on the latest php:8.3-apache

      - name: Report PHP version
        run: docker run --rm --entrypoint php ghcr.io/bluecroftweb/wordpress:php8.3-apache -v | head -1
